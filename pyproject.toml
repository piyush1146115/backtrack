[project]
name = "backtrack"
version = "0.1.0"
description = "A flight recorder for AI coding agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
backtrack = "backtrack.cli:main"
backtrack-hook = "backtrack.hooks.__main__:plugin_main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
