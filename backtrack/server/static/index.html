// Snippets mark matches with \x01 … \x02; build <mark>s without innerHTML.
function highlighted(snippet) {
  const out = [];
  for (const [i, part] of snippet.replace(/\s+/g, " ").split(/[\x01\x02]/).entries())
    if (part) out.push(i % 2 ? h("mark", {}, part) : part);
  return out;
}

const sessionById = (id) => state.sessions.find(s => s.session_id === id);
const turnOf = (id, turn) => { const s = sessionById(id); return s && s.fork_turn ? turn + s.fork_turn - 1 : turn; };

// Group items by session, keeping the order in which sessions first appear.
function bySession(items) {
  const groups = new Map();
  for (const it of items) {
    if (!groups.has(it.session_id)) groups.set(it.session_id, []);
    groups.get(it.session_id).push(it);
  }
  return [...groups.entries()];
}

function sessionGroup(id, rows) {
  const s = sessionById(id) || {session_id: id};
  return h("div", {class: "card hits" + (s.parent_session ? " fork" : "")},
    h("div", {class: "col-head"}, h("a", {href: "#/s/" + id},
      s.parent_session && h("span", {class: "tag fork", style: "margin-right:8px"}, `⑂ fork of ${short(s.parent_session)} @ turn ${s.fork_turn}`),
      oneLine(stripForkNote(s.first_prompt), 110) || "(no prompt)", " ",
      h("span", {class: "meta mono"}, short(id)))),
    rows);
}

function renderSearch() {
  const main = document.getElementById("main");
  const {q, hits} = state.search;
  if (!q.trim()) { main.replaceChildren(h("div", {class: "empty"}, "Type to search every recorded session.")); return; }
  if (!hits) { main.replaceChildren(h("div", {class: "empty"}, "Searching…")); return; }
  main.replaceChildren(h("div", {},
    h("h2", {}, "Search"),
    h("div", {class: "summary meta"}, hits.length ? `${plural(hits.length, "match", "matches")}${hits.length === 50 ? " (best 50)" : ""} for “${q}”` : `No matches for “${q}”.`),
    bySession(hits).map(([id, rows]) => sessionGroup(id, rows.map(hit =>
      h("a", {class: "hit", href: `#/s/${id}/e/${hit.seq}`},
        h("span", {class: "where"}, h("span", {class: "meta"}, `Turn ${turnOf(id, hit.turn)}`),
          h("span", {class: "tag"}, hit.tool_name || {prompt: "prompt", stop: "reply"}[hit.kind] || hit.kind),
          hit.irreversible && h("span", {class: "tag pnr"}, "⚠")),
        h("span", {class: "text mono"}, highlighted(hit.snippet))))))));
}

function renderIrreversible(events) {
  const main = document.getElementById("main");
  main.replaceChildren(h("div", {},
    h("h2", {}, "Points of no return"),
    h("div", {class: "summary meta"}, events.length
      ? "Actions with outside effects: pushes, publishes, deploys, network writes. Rewinding or forking restores files and conversation, but these already happened."
      : "No irreversible actions recorded."),
    bySession(events).map(([id, rows]) => sessionGroup(id, rows.map(e =>
      h("a", {class: "hit", href: `#/s/${id}/e/${e.seq}`},
        h("span", {class: "where"}, h("span", {class: "meta"}, `Turn ${turnOf(id, e.turn)}`), h("span", {class: "tag pnr"}, "⚠ " + e.tool_name)),
        h("span", {class: "text mono"}, describeInput(e.input), " ", h("span", {class: "meta"}, fmtTime(e.ts)))))))));
}

let searchSeq = 0;
async function loadSearch(q) {
  state.view = "search"; state.current = null;
  state.search = {q, hits: null};
  const input = document.getElementById("q");
  if (document.activeElement !== input) input.value = q;
  renderSessions(); renderSearch();
  if (!q.trim()) return;
  const mine = ++searchSeq;
  try {
    const hits = await api("/api/search?q=" + encodeURIComponent(q));
    if (mine === searchSeq) { state.search.hits = hits; renderSearch(); }
  } catch { if (mine === searchSeq) { state.search.hits = []; renderSearch(); } }
}

// Open, scroll to and flash the element showing event `seq`.
function focusEvent(seq) {
  const e = state.data && state.data.events.find(e => e.seq === seq);
  if (!e) return;
  if (e.kind === "tool_pre" || e.kind === "tool_post") { state.open.add("d:" + (e.tool_use_id || "seq" + e.seq)); renderSession(); }
  const el = document.querySelector(`[data-seq~="${seq}"]`);
  if (el) { el.scrollIntoView({block: "center"}); el.classList.add("flash"); }
}

// ---- data loading ----------------------------------------------------------

async function loadSessions() {
  state.sessions = await api("/api/sessions");
  renderSessions();
}

async function loadSession(id, keepOpen) {
  if (!keepOpen) state.open.clear();
  state.view = "session"; state.current = id;
  try { state.data = await api("/api/sessions/" + encodeURIComponent(id)); }
  catch { state.data = null; }
  renderSessions();
  renderSession();
}

async function loadIrreversible() {
  state.view = "irreversible"; state.current = null;
  renderSessions();
  try { renderIrreversible(await api("/api/irreversible")); }
  catch { document.getElementById("main").replaceChildren(h("div", {class: "empty"}, "Could not load.")); }
}

function route() {
  document.getElementById("pnr-link").classList.toggle("active", location.hash === "#/irreversible");
  const section = /^#\/compare/.test(location.hash) ? "compare" : location.hash === "#/project" ? "project"
                : location.hash === "#/audit" ? "audit"
                : ["", "#", "#/"].includes(location.hash) ? "home" : "";
  for (const a of document.querySelectorAll("header nav a")) a.classList.toggle("active", a.dataset.nav === section);
  let m;
  if ((m = location.hash.match(/^#\/compare\/([^/]+)\/([^/]+)$/))) loadCompare(decodeURIComponent(m[1]), decodeURIComponent(m[2]));
  else if ((m = location.hash.match(/^#\/s\/([^/]+)\/e\/(\d+)$/))) loadSession(decodeURIComponent(m[1])).then(() => focusEvent(+m[2]));
  else if ((m = location.hash.match(/^#\/s\/([^/]+)$/))) loadSession(decodeURIComponent(m[1]));
  else if ((m = location.hash.match(/^#\/s\/([^/]+)\/rewind\/(\d+)$/))) loadSession(decodeURIComponent(m[1])).then(() => openRewind(+m[2]));
  else if ((m = location.hash.match(/^#\/rank\/([^/]+)\/(\d+)$/))) loadRank(decodeURIComponent(m[1]), +m[2]);
  else if ((m = location.hash.match(/^#\/search\/(.*)$/))) loadSearch(decodeURIComponent(m[1]));
  else if (location.hash === "#/irreversible") loadIrreversible();
  else if (location.hash === "#/compare") { state.view = "picker"; state.current = null; renderSessions(); renderPicker(); }
  else if (location.hash === "#/project") loadProject();
  else if (location.hash === "#/audit") loadAudit();
  else loadHome();
}

// Open the rewind panel of a turn of the open session and scroll to it.
function openRewind(turn) {
  state.open.add("rw:" + turn);
  renderSession();
  const el = document.getElementById("turn-" + turn);
  if (el) el.scrollIntoView({block: "start"});
}

// Live view: refresh when new events arrive in the open session.
async function poll() {
  try {
    const before = state.sessions.find(s => s.session_id === state.current);
    await loadSessions();
    const after = state.sessions.find(s => s.session_id === state.current);
    const typing = document.activeElement && document.activeElement.closest(".rw-panel");
    if (state.view === "session" && !typing && before && after && after.events !== before.events) await loadSession(state.current, true);
    if (state.view === "picker" && !document.activeElement.closest("#main")) renderPicker();
    if (state.view === "home") await refreshHome();
    if (state.view === "rank" && state.rank.data && !state.rank.running && !document.activeElement.closest("#main input")
        && state.rank.data.branches.some(b => b.status === "running")) await refreshRank();
  } catch {}
}

api("/api/project").then(p => { state.project = p; document.getElementById("root").textContent = p.root; showHooks(); });
window.addEventListener("hashchange", route);
let searchTimer;
document.getElementById("q").addEventListener("input", (ev) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const q = ev.target.value;
    // One history entry per search, not per keystroke.
    history[state.view === "search" ? "replaceState" : "pushState"](null, "", "#/search/" + encodeURIComponent(q));
    loadSearch(q);
  }, 200);
});
loadSessions().then(route);
setInterval(poll, 3000);
</script>
</body>
</html>
